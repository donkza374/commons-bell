plugins {
    id 'com.android.application'
}

android {
    namespace 'com.commonsbell'
    compileSdk 34

    defaultConfig {
        applicationId "com.commonsbell"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Only WorkManager (for the scheduled background refresh) plus the Android
// framework. Data fetching uses HttpURLConnection + org.json (both built in).
dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
}
