plugins {
    id 'com.android.application'
}

android {
    namespace 'com.commonsbell'
    compileSdk 34

    defaultConfig {
        applicationId "com.commonsbell"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "0.4.1"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
            storePassword System.getenv("COMMONS_BELL_KEYSTORE_PASS") ?: ""
            keyAlias System.getenv("COMMONS_BELL_KEY_ALIAS") ?: "commonsbell"
            keyPassword System.getenv("COMMONS_BELL_KEYSTORE_PASS") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// WorkManager (scheduled background refresh) + SwipeRefreshLayout (pull-to-refresh).
// Everything else is the Android framework (HttpURLConnection + org.json for data).
dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
